name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No `version:` here — package.json already pins the exact version via
      # "packageManager": "pnpm@11.20.0", and pnpm/action-setup@v4 refuses to run if
      # both are set (even when they'd agree), per a real CI failure on the first push.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          # pnpm 11.20.0 (pinned via packageManager) uses node:sqlite internally and
          # requires Node >= 22.13 — the first real CI run failed here too, on the
          # workspace's old ">=20" engines constraint. Matches package.json's engines.
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build apps/web
        run: pnpm -F web build

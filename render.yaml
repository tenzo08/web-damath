services:
  - type: web
    name: damath-server
    runtime: node
    plan: free
    rootDir: .
    # `prisma generate` used to only run via apps/server's own postinstall script, on
    # the assumption that `pnpm install` always re-triggers it. It doesn't reliably:
    # Render can restore a cached node_modules across deploys and skip re-running
    # lifecycle scripts, and prisma/schema.prisma isn't part of the lockfile hash that
    # cache is keyed on -- a schema-only change (no new dependency) could deploy with a
    # stale generated Prisma Client that doesn't know about the new columns, causing a
    # real 500 the instant a route tries to write one (confirmed live: /auth/signup and
    # /auth/google/complete both failed this way against the deployed server directly).
    # An explicit generate step here can't be skipped by that cache.
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @damath/server exec prisma generate
    startCommand: pnpm -F @damath/server start
    healthCheckPath: /health
    envVars:
      # Real Postgres persistence (Prisma — apps/server/prisma/schema.prisma), e.g. a
      # Neon connection string. Set this to enable it; left unset, the server falls back
      # to the JSON file stores, which do NOT survive a redeploy on Render (see
      # DEPLOYMENT.md's honest caveats). Required for the explicit `prisma generate`
      # buildCommand step above to succeed -- just `prisma migrate deploy` once,
      # manually, the first time (Render's Shell tab), to actually create the tables
      # against a fresh database.
      - key: DATABASE_URL
        sync: false
      # Works around a real Render build failure: `corepack enable` fails with "Cannot
      # find matching keyid" because the corepack bundled with the pinned Node version
      # (.node-version) has a stale npm-registry signing-key set (nodejs/corepack#625 —
      # this hits many CI/host providers, not specific to this repo). Setting this to
      # '0' skips corepack's signature check on the pnpm binary it fetches. That's a
      # real, understood tradeoff (not "no risk") in exchange for not having to change
      # buildCommand to upgrade corepack itself first. `pnpm install --frozen-lockfile`
      # right after it still verifies every dependency against the committed lockfile,
      # so this only weakens the one link in the chain: corepack's own download of pnpm.
      - key: COREPACK_INTEGRITY_KEYS
        value: '0'
      # Generated once by Render on first deploy — never committed, never a default.
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: 3001
      # Set to the deployed web app's real origin after the first deploy — see
      # apps/server/src/app.ts's corsOrigin option.
      - key: CORS_ORIGIN
        sync: false
      - key: QUEUE_BOT_TIER
        value: steady
      - key: QUEUE_BOT_TIMEOUT_MS
        value: '90000'
      # A Google Cloud OAuth Client ID (not a secret -- it's meant to be public). Must
      # match the value baked into the deployed web app's VITE_GOOGLE_CLIENT_ID exactly.
      # Verifies a Google ID token's `aud` claim server-side (auth/routes.ts's
      # /auth/google). Left unset here, Google sign-in just isn't offered.
      - key: GOOGLE_CLIENT_ID
        sync: false
      # A shared secret that unlocks POST /auth/dev-login (apps/server/src/auth/routes.ts)
      # -- mints a real session for an existing account by email, bypassing Google
      # entirely. Only set this if you actually need to seed/test accounts that can't go
      # through a real Google sign-in (e.g. a dummy tournament bracket); left unset, the
      # route isn't registered at all. Generate with: openssl rand -hex 32
      - key: DEV_LOGIN_SECRET
        sync: false
